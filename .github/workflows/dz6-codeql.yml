# ДЗ6 · Аудит безопасности: статический анализ кода CodeQL (набор security-extended — правила по OWASP Top 10:
# XSS, open redirect, инъекции, утечки в логи, небезопасные регулярные выражения).
# Находки появляются в Security → Code scanning; новые находки в pull request видны прямо в PR.
name: ДЗ6 CodeQL

on:
  push:
    branches: [main]
    paths: ['ДЗ6/poravnu/**', '.github/workflows/**']
  pull_request:
    paths: ['ДЗ6/poravnu/**', '.github/workflows/**']
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            source-root: ДЗ6/poravnu
          # Сами workflow тоже код: проверяются права GITHUB_TOKEN, подстановка ${{ }} в run, незакреплённые actions.
          - language: actions
            source-root: .github
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          source-root: ${{ matrix.source-root }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results

      # Итог анализа — аннотациями к запуску: видно в Actions без доступа к разделу Security.
      - name: Итог CodeQL
        if: always()
        run: |
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          [ ${#files[@]} -gt 0 ] || { echo "::warning title=CodeQL::SARIF не найден"; exit 0; }
          rules=$(jq '[.runs[].tool.driver.rules // [] | length] | add // 0' "${files[@]}" | paste -sd+ | bc)
          found=$(jq '[.runs[].results[]?] | length' "${files[@]}" | paste -sd+ | bc)
          echo "::notice title=CodeQL ${{ matrix.language }}::правил проверено: $rules, найдено: $found"
          jq -r '.runs[].results[]? | "::warning file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine // 1),title=CodeQL \(.ruleId)::\(.message.text | gsub("\n"; " "))"' "${files[@]}" | head -10
